name: Verify KOREN
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: koren
          POSTGRES_PASSWORD: koren_local_only
          POSTGRES_DB: koren
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U koren -d koren"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
        working-directory: backend
        env:
          DB_TEST_URL: jdbc:postgresql://localhost:5432/koren
          DB_TEST_USER: koren
          DB_TEST_PASSWORD: koren_local_only
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run api:check && npm run format:check && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.29'
          python-version: '3.12'
      - run: |
          uv sync --frozen
          uv run pytest -q
          uv run ruff check .
          uv run ruff format --check app scripts tests
          uv run pylint app
        working-directory: ml
  integration:
    needs: [backend, frontend, ml]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.29'
          python-version: '3.12'
      - run: docker compose --env-file .env.example -f compose.yaml -f compose.test.yaml up --build -d
      - run: python3 scripts/smoke.py
      - run: ./mvnw -B verify
        working-directory: backend
        env:
          DB_TEST_URL: jdbc:postgresql://localhost:5432/koren
          DB_TEST_USER: koren
          DB_TEST_PASSWORD: koren_local_only
          INFERENCE_TEST_URL: http://127.0.0.1:18081
          KAFKA_TEST_BOOTSTRAP: localhost:9092
      - run: uv sync --frozen && uv run pytest -q tests/test_kafka_replay.py
        working-directory: ml
        env:
          KAFKA_TEST_BOOTSTRAP: localhost:9092
      - run: docker compose --env-file .env.example stop ml
      - run: python3 scripts/smoke.py --expect-mode MANUAL
      - if: failure()
        run: docker compose --env-file .env.example ps && docker compose --env-file .env.example logs --tail=60 backend ml kafka
      - if: always()
        run: docker compose --env-file .env.example down -v

  miniapp:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python3 scripts/check_miniapp.py

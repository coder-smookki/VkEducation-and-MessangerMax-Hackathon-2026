name: koren
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-koren}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env for local development}
      POSTGRES_DB: ${DB_NAME:-koren}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["127.0.0.1:9092:9092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", " /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
  ml:
    build: ./ml
    environment:
      KOREN_CHROMA_PATH: /app/data/chroma
      KOREN_KAFKA_ENABLED: "true"
      KOREN_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KOREN_KAFKA_TOPIC: ${KAFKA_CASE_UPDATES_TOPIC:-koren.case-updates}
      KOREN_KAFKA_GROUP_ID: ${KAFKA_ML_GROUP_ID:-koren-ml-indexer}
      KOREN_COMPARE_ANALYZER: ${COMPARE_ANALYZER:-stub}
    volumes: ["chroma-data:/app/data/chroma"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-koren}
      DB_USER: ${DB_USER:-koren}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env}
      INFERENCE_URL: http://ml:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
      KAFKA_CASE_UPDATES_TOPIC: ${KAFKA_CASE_UPDATES_TOPIC:-koren.case-updates}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_WORKERS_ENABLED: ${MAX_WORKERS_ENABLED:-false}
      ANALYSIS_ENABLED: ${ANALYSIS_ENABLED:-false}
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: {condition: service_healthy}
      kafka: {condition: service_healthy}
      ml: {condition: service_started}
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      backend: {condition: service_started}
volumes:
  postgres-data:
  kafka-data:
  chroma-data:

name: koren
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-koren}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env for local development}
      POSTGRES_DB: ${DB_NAME:-koren}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  ml:
    build: ./ml
    # Intentionally no host port and no DB credentials. This is an internal advisory service.
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-koren}
      DB_USER: ${DB_USER:-koren}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env}
      INFERENCE_URL: http://ml:8000
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: {condition: service_healthy}
      ml: {condition: service_started}
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      backend: {condition: service_started}
volumes:
  postgres-data:

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
# MAX Web may embed the app; X-Frame-Options DENY/SAMEORIGIN would break that launch.
# Profile photos supplied by MAX currently use this CDN; no general external-image permission.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://st.max.ru; connect-src 'self'; img-src 'self' data: https://i.oneme.ru; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://web.max.ru https://max.ru" always;

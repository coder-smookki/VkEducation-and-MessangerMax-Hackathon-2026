add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
# MAX Web may embed the app; X-Frame-Options DENY/SAMEORIGIN would break that launch.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://st.max.ru; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

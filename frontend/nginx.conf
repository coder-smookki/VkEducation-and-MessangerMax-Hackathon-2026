worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 256k;
    # Hashed bundles and SVG logos are text; Mini App users are often on mobile data.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream koren_backend {
        zone koren_backend 64k;
        server backend:8080 resolve;
    }
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
        error_page 413 = @too_large;
        location @too_large {
            include /etc/nginx/security-headers.conf;
            add_header X-Request-Id $request_id always;
            default_type application/problem+json;
            return 413 '{"type":"about:blank","title":"Слишком большое тело запроса","status":413,"code":"PAYLOAD_TOO_LARGE","requestId":"$request_id"}';
        }
        location /api/ {
            proxy_pass http://koren_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_intercept_errors off;
            error_page 413 = @too_large;
            error_page 502 503 504 = @api_unavailable;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control no-store always;
        }
        location = /max/webhook {
            proxy_pass http://koren_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 15s;
            error_page 413 = @too_large;
            error_page 502 503 504 = @api_unavailable;
        }
        location = /actuator/health {
            limit_except GET { deny all; }
            proxy_pass http://koren_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            error_page 502 503 504 = @api_unavailable;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control no-store always;
        }
        location = /actuator/info {
            limit_except GET { deny all; }
            proxy_pass http://koren_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            error_page 502 503 504 = @api_unavailable;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control no-store always;
        }
        location /actuator {
            include /etc/nginx/security-headers.conf;
            add_header X-Request-Id $request_id always;
            add_header Cache-Control no-store always;
            default_type application/problem+json;
            return 404 '{"type":"about:blank","title":"Не найдено","status":404,"code":"NOT_FOUND","requestId":"$request_id"}';
        }
        location @api_unavailable {
            include /etc/nginx/security-headers.conf;
            add_header X-Request-Id $request_id always;
            default_type application/problem+json;
            add_header Cache-Control no-store always;
            return 503 '{"type":"about:blank","title":"Сервис временно недоступен","status":503,"code":"SERVICE_UNAVAILABLE","requestId":"$request_id"}';
        }
        location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
        location /assets/ {
            try_files $uri =404;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control 'public, max-age=31536000, immutable';
        }
        location /brand/ {
            try_files $uri =404;
            include /etc/nginx/security-headers.conf;
            # Stable file names without a hash: cache for a day, not forever.
            add_header Cache-Control 'public, max-age=86400';
        }
        location / {
            try_files $uri $uri/ /index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control 'no-cache, no-store, must-revalidate';
        }
    }
}

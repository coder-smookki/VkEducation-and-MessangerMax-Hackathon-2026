spring:
  application:
    name: koren-backend
  profiles:
    group:
      local: [demo, no-db]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/koren}
    username: ${DB_USER:koren}
    password: ${DB_PASSWORD:}
  flyway:
    clean-disabled: true
    validate-migration-naming: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
koren:
  inference-url: ${INFERENCE_URL:http://127.0.0.1:8000}

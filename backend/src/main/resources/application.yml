spring:
  application:
    name: koren-backend
  profiles:
    group:
      local: [demo, no-db]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/koren}
    username: ${DB_USER:koren}
    password: ${DB_PASSWORD:}
  flyway:
    clean-disabled: true
    validate-migration-naming: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      modify-topic-configs: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
koren:
  inference-url: ${INFERENCE_URL:http://127.0.0.1:8000}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    case-updates-topic: ${KAFKA_CASE_UPDATES_TOPIC:koren.case-updates}

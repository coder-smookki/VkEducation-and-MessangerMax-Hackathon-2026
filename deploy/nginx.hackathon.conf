# Host nginx on the shared server. The release web container binds 127.0.0.1:8091.
# Obtain the koren-hackathon certificate through DNS-01 before enabling TLS.
server {
    listen 80;
    listen [::]:80;
    server_name hackathon.lumnex.ru;
    access_log off;
    location / { return 308 https://hackathon.lumnex.ru$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hackathon.lumnex.ru;
    ssl_certificate /etc/letsencrypt/live/koren-hackathon/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koren-hackathon/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    add_header Strict-Transport-Security "max-age=15552000" always;
    client_max_body_size 256k;
    error_page 413 = @too_large;
    error_page 502 503 504 = @unavailable;
    location @too_large {
        default_type application/problem+json;
        add_header X-Request-Id $request_id always;
        add_header Cache-Control no-store always;
        return 413 '{"type":"about:blank","title":"Слишком большое тело запроса","status":413,"code":"PAYLOAD_TOO_LARGE","requestId":"$request_id"}';
    }
    location @unavailable {
        default_type application/problem+json;
        add_header X-Request-Id $request_id always;
        add_header Cache-Control no-store always;
        return 503 '{"type":"about:blank","title":"Сервис временно недоступен","status":503,"code":"SERVICE_UNAVAILABLE","requestId":"$request_id"}';
    }
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_intercept_errors off;
    }
}
